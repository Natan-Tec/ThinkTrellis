name: Build ThinkTrellis

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            sep: ";"
            icon: --icon assets/thinktrellis.ico
            artifact: ThinkTrellis-Windows
            output: dist/ThinkTrellis.exe
          - name: Linux
            # Ubuntu 22.04 gera um executável que roda também em sistemas mais antigos.
            os: ubuntu-22.04
            sep: ":"
            icon: ""
            artifact: ThinkTrellis-Linux
            output: dist/ThinkTrellis-linux.tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Instalar Tk e tela virtual (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libtk8.6 xvfb

      - name: Instalar dependências
        run: python -m pip install -r requirements-build.txt

      - name: Testes (Linux, com tela virtual)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v

      - name: Testes (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v

      - name: Gerar executável
        shell: bash
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --onefile
          --name ThinkTrellis ${{ matrix.icon }}
          --add-data "assets${{ matrix.sep }}assets" main.py

      - name: Empacotar (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/ThinkTrellis
          tar -C dist -czf dist/ThinkTrellis-linux.tar.gz ThinkTrellis

      - name: Conferir o arquivo gerado
        shell: bash
        run: ls -l "${{ matrix.output }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ThinkTrellis.exe
            release/ThinkTrellis-linux.tar.gz
